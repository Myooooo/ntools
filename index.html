<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" id="nc-theme-color" content="#0b0e13">
    <title>nChat · 正在进入 nTools</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%235b8cff'/%3E%3Cpath d='M55 18 30 56h18l-3 26 25-38H52l3-26z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: auto;
            padding: 24px;
        }
        .redirect-card {
            width: min(460px, 100%);
            padding: 32px 30px;
            background: var(--nc-surface);
            border: 1px solid var(--nc-border);
            border-radius: var(--nc-radius-xl);
            box-shadow: var(--nc-shadow-2);
            text-align: center;
        }
        .redirect-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            margin-bottom: 16px;
            border-radius: 16px;
            background: var(--nc-gradient-accent);
            color: #fff;
            font-size: 26px;
            box-shadow: var(--nc-shadow-accent);
        }
        .redirect-title { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
        .redirect-desc { margin-top: 8px; color: var(--nc-text-2); font-size: 14px; line-height: 1.65; }
        .redirect-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            margin-top: 22px;
            padding: 0 18px;
            border-radius: var(--nc-radius-md);
            background: var(--nc-gradient-accent);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: var(--nc-shadow-accent);
        }
    </style>
    <script>
        // nChat 已原生整合进 nTools：#nchat；旧书签自动跳转。
        try { location.replace('ntools.html#nchat'); } catch (err) { /* 手动链接兜底 */ }
    </script>
</head>
<body>
    <main class="redirect-card">
        <div class="redirect-logo" aria-hidden="true">⚡</div>
        <h1 class="redirect-title">nChat 已整合进 nTools</h1>
        <p class="redirect-desc">聊天现在是 nTools 的一个标签页，模型端点、Todo AI 与聊天共享全局设置。正在为你跳转…</p>
        <a class="redirect-link" href="ntools.html#nchat">进入 nChat</a>
    </main>
</body>
</html>
