<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="nChat — 本地运行的 AI 聊天前端（OpenAI 兼容接口）">
    <title>nChat</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/chat.css">

    <script src="js/theme-boot.js"></script>
    <script defer src="js/polyfills.js"></script>
    <script defer src="js/marked.min.js"></script>
    <script defer src="js/purify.min.js"></script>
    <script defer src="js/core.js"></script>
    <script defer src="js/compat.js"></script>
    <script defer src="js/icons.js"></script>
    <script defer src="js/storage.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/schema-chat.js"></script>
    <script defer src="js/settings-store.js"></script>
    <script defer src="js/conversation-store.js"></script>
    <script defer src="js/sse.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/message-view.js"></script>
    <script defer src="js/composer.js"></script>
    <script defer src="js/settings-view.js"></script>
    <script defer src="js/chat-controller.js"></script>
    <script defer src="js/app.js"></script>
</head>

<body>
    <div class="chat-app">
        <header class="chat-toolbar">
            <button id="title-wrapper" class="chat-title" type="button" title="切换配置" aria-haspopup="menu" aria-expanded="false" aria-controls="config-dropdown-menu">
                <h1 id="app-title" class="chat-title__text">nChat</h1>
                <svg class="chat-title__chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="m6 9 6 6 6-6" />
                </svg>
            </button>
            <div class="chat-toolbar__actions">
                <button id="toggle-settings-btn" class="chat-icon-btn" type="button" title="设置" aria-label="设置" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-panel">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="12" cy="12" r="3" />
                        <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z" />
                    </svg>
                </button>
                <button id="menu-btn" class="chat-icon-btn" type="button" title="菜单" aria-label="主菜单" aria-haspopup="menu" aria-expanded="false" aria-controls="main-menu">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M3 6h18M3 12h18M3 18h18" />
                    </svg>
                </button>
            </div>
        </header>

        <div id="main-menu" class="chat-menu chat-menu--right" role="menu" aria-label="主菜单" aria-hidden="true">
            <button id="theme-toggle-btn" class="chat-menu__item" type="button" role="menuitem">
                <span class="chat-menu__icon" aria-hidden="true">
                    <svg class="nc-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                    </svg>
                </span>
                <span class="chat-menu__label">浅色模式</span>
            </button>
            <button id="lite-mode-btn" class="chat-menu__item" type="button" role="menuitem">
                <span class="chat-menu__icon" aria-hidden="true">
                    <svg class="nc-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z" />
                    </svg>
                </span>
                <span class="chat-menu__label">Lite 模式</span>
            </button>
            <div class="chat-menu__divider" role="separator"></div>
            <button id="export-conversation-btn" class="chat-menu__item" type="button" role="menuitem">
                <span class="chat-menu__icon" aria-hidden="true">
                    <svg class="nc-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <path d="M7 10l5 5 5-5" />
                        <path d="M12 15V3" />
                    </svg>
                </span>
                <span class="chat-menu__label">导出对话</span>
            </button>
            <button id="backup-conversation-btn" class="chat-menu__item" type="button" role="menuitem">
                <span class="chat-menu__icon" aria-hidden="true">
                    <svg class="nc-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="m12 2 9 5-9 5-9-5Z" />
                        <path d="m3 12 9 5 9-5" />
                        <path d="m3 17 9 5 9-5" />
                    </svg>
                </span>
                <span class="chat-menu__label">备份对话</span>
            </button>
            <button id="restore-conversation-btn" class="chat-menu__item" type="button" role="menuitem">
                <span class="chat-menu__icon" aria-hidden="true">
                    <svg class="nc-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <path d="M17 8l-5-5-5 5" />
                        <path d="M12 3v12" />
                    </svg>
                </span>
                <span class="chat-menu__label">恢复对话</span>
            </button>
            <div class="chat-menu__divider" role="separator"></div>
            <button id="clear-chat-btn" class="chat-menu__item is-danger" type="button" role="menuitem">
                <span class="chat-menu__icon" aria-hidden="true">
                    <svg class="nc-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6" />
                        <path d="M10 11v6M14 11v6" />
                    </svg>
                </span>
                <span class="chat-menu__label">清除对话</span>
            </button>
        </div>

        <div id="config-dropdown-menu" class="chat-menu chat-menu--left" role="menu" aria-label="配置列表" aria-hidden="true"></div>

        <div id="storage-banner" class="chat-banner" role="status" hidden></div>

        <section id="settings-panel" class="chat-settings" aria-labelledby="settings-title" aria-hidden="true">
            <div class="chat-settings__head">
                <h2 id="settings-title" class="chat-settings__title">设置</h2>
                <button id="settings-close-btn" class="chat-icon-btn" type="button" title="关闭设置" aria-label="关闭设置">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M18 6 6 18M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="chat-settings__scroll nc-scroll">
                <div class="chat-settings__grid">
                    <div class="nc-field chat-settings__config">
                        <label class="nc-label" for="config-select">配置选择</label>
                        <div class="chat-settings__config-row">
                            <select id="config-select" class="nc-select" aria-label="配置选择"></select>
                            <button id="add-config-btn" class="nc-btn nc-btn--icon nc-btn--sm" type="button" title="新建配置" aria-label="新建配置">
                                <svg class="nc-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                    <path d="M12 5v14M5 12h14" />
                                </svg>
                            </button>
                            <button id="delete-config-btn" class="nc-btn nc-btn--icon nc-btn--sm" type="button" title="删除配置" aria-label="删除配置">
                                <svg class="nc-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                    <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6" />
                                    <path d="M10 11v6M14 11v6" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="nc-field">
                        <label class="nc-label" for="config-name">配置名称</label>
                        <input id="config-name" class="nc-input" type="text" maxlength="80" autocomplete="off" placeholder="例如：GPT-4o 编程助手">
                    </div>
                    <div class="nc-field chat-settings__full">
                        <label class="nc-label" for="system-prompt">System Prompt</label>
                        <textarea id="system-prompt" class="nc-textarea" rows="3" placeholder="例如：你是一个专业的全栈工程师，请用中文回答。"></textarea>
                    </div>
                    <div class="nc-field">
                        <label class="nc-label" for="api-url">Base URL</label>
                        <input id="api-url" class="nc-input" type="text" autocomplete="off" spellcheck="false" placeholder="例如：https://api.openai.com/v1">
                    </div>
                    <div class="nc-field">
                        <label class="nc-label" for="api-key">API Key</label>
                        <input id="api-key" class="nc-input" type="password" autocomplete="new-password" spellcheck="false" placeholder="sk-...">
                    </div>
                    <div class="nc-field chat-settings__full">
                        <label class="nc-label" for="model-id">Model ID</label>
                        <input id="model-id" class="nc-input" type="text" autocomplete="off" spellcheck="false" placeholder="例如：gpt-4o">
                    </div>
                    <div class="chat-settings__full">
                        <button id="advanced-toggle-btn" class="chat-advanced-toggle" type="button" aria-expanded="false" aria-controls="advanced-settings-container">
                            <span>高级参数设置</span>
                            <svg class="nc-icon chat-advanced-toggle__chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="m6 9 6 6 6-6" />
                            </svg>
                        </button>
                        <div id="advanced-settings-container" class="chat-advanced" aria-hidden="true">
                            <div class="chat-advanced__row">
                                <label class="nc-label chat-advanced__label" for="temp-slider">Temp</label>
                                <input id="temp-slider" class="chat-advanced__range" type="range" min="0" max="2" step="0.1" value="1" aria-label="Temperature 滑杆">
                                <input id="temp-input" class="nc-input chat-advanced__number" type="number" min="0" max="2" step="0.1" value="1" aria-label="Temperature 数值">
                            </div>
                            <div class="chat-advanced__row">
                                <label class="nc-label chat-advanced__label" for="topp-slider">Top P</label>
                                <input id="topp-slider" class="chat-advanced__range" type="range" min="0" max="2" step="0.05" value="0.95" aria-label="Top P 滑杆">
                                <input id="topp-input" class="nc-input chat-advanced__number" type="number" min="0" max="2" step="0.05" value="0.95" aria-label="Top P 数值">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <footer class="chat-settings__footer">
                <span id="save-status" class="chat-save-status" role="status" aria-live="polite"></span>
                <input type="file" id="import-settings-input" accept=".json,application/json" hidden>
                <button id="import-settings-btn" class="nc-btn" type="button">导入配置</button>
                <button id="export-settings-btn" class="nc-btn" type="button">导出配置</button>
                <button id="save-settings-btn" class="nc-btn nc-btn--primary" type="button">保存配置</button>
            </footer>
        </section>

        <main id="chat-container" class="chat-main" role="log" aria-label="对话" aria-live="off" tabindex="0"></main>
        <button id="jump-bottom-btn" class="chat-jump" type="button" title="回到底部" aria-label="回到底部" hidden>
            <svg class="nc-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M12 5v14M19 12l-7 7-7-7" />
            </svg>
        </button>

        <footer id="input-area-container" class="chat-composer">
            <div id="image-preview-container" class="chat-previews" aria-label="待发送图片" hidden></div>
            <div class="chat-composer__row">
                <input type="file" id="image-input" accept="image/*" multiple hidden>
                <button id="upload-btn" class="chat-icon-btn chat-icon-btn--soft" type="button" title="上传图片" aria-label="上传图片">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <path d="m21 15-5-5L5 21" />
                    </svg>
                </button>
                <textarea id="user-input" class="chat-input" rows="1" spellcheck="false" placeholder="输入消息，Enter 发送，Shift + Enter 换行" aria-label="输入消息"></textarea>
                <button id="send-btn" class="chat-send" type="button" title="发送" aria-label="发送">
                    <span class="chat-send__icon chat-send__icon--send">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path d="m22 2-7 20-4-9-9-4Z" />
                            <path d="M22 2 11 13" />
                        </svg>
                    </span>
                    <span class="chat-send__icon chat-send__icon--stop">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <rect x="6" y="6" width="12" height="12" rx="2" />
                        </svg>
                    </span>
                </button>
            </div>
        </footer>
    </div>

    <div id="image-lightbox" class="chat-lightbox" role="dialog" aria-modal="true" aria-label="图片预览" hidden>
        <button id="lightbox-close" class="chat-lightbox__close" type="button" title="关闭预览" aria-label="关闭预览">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M18 6 6 18M6 6l12 12" />
            </svg>
        </button>
        <img id="lightbox-img" class="chat-lightbox__img" alt="图片预览">
    </div>

    <input type="file" id="restore-conversation-input" accept=".json,application/json" hidden>
    <div id="chat-status" class="nc-sr-only" role="status" aria-live="polite"></div>
</body>

</html>
