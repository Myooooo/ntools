<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时薪资累计</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#131922; --text:#edf1f7; --text2:#9aa7b8; --line:rgba(255,255,255,.1);
    --accent:#6ea8fe; --accent2:#a78bfa; --ok:#45d6a0; --warn:#e8b45a;
    --hero:linear-gradient(135deg,#5b8cff 0%,#8b5cf6 55%,#d946ef 100%);
    --soft:rgba(110,168,254,.14);
  }
  html[data-theme="light"]{
    --bg:#f4f5f7; --panel:#ffffff; --text:#15181d; --text2:#56616f; --line:rgba(0,0,0,.1);
    --accent:#2a63c8; --accent2:#7c5cf5; --ok:#0e9a6a; --warn:#8a5c12;
    --soft:rgba(47,111,219,.1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  body{padding:20px 22px 26px;max-width:760px;margin:0 auto}
  .hero{position:relative;overflow:hidden;border-radius:18px;padding:24px 24px 20px;color:#fff;
    background:var(--hero);box-shadow:0 18px 44px -24px rgba(91,140,255,.75)}
  html[data-theme="light"] .hero{box-shadow:0 16px 34px -26px rgba(42,99,200,.55)}
  .hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;
    background:rgba(255,255,255,.16);filter:blur(2px)}
  .hero__label{font-size:12.5px;letter-spacing:.12em;opacity:.86;font-weight:600}
  .hero__amount{display:flex;align-items:baseline;gap:6px;margin-top:6px;font-variant-numeric:tabular-nums}
  .hero__amount .cur{font-size:22px;font-weight:600;opacity:.92}
  .hero__amount .num{font-size:clamp(34px,7vw,54px);font-weight:750;letter-spacing:-.03em;line-height:1.05}
  .hero__amount .dec{font-size:20px;font-weight:650;opacity:.9}
  .hero__mood{margin-top:12px;font-size:13.5px;line-height:1.6;min-height:22px;opacity:.95}
  .hero__bar{margin-top:14px;height:7px;border-radius:99px;background:rgba(255,255,255,.24);overflow:hidden}
  .hero__bar>i{display:block;height:100%;width:0%;border-radius:99px;background:#fff;transition:width .5s ease}
  .hero__meta{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;opacity:.9}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .card__label{font-size:11.5px;color:var(--text2)}
  .card__value{margin-top:4px;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
  .card__unit{font-size:11.5px;color:var(--text2);font-weight:400;margin-left:2px}

  .settings{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .settings h2{margin:0 0 10px;font-size:12px;color:var(--text2);letter-spacing:.1em;font-weight:600}
  .fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}
  .field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  .field input,.field select{background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:7px 9px;font-size:12.5px;outline:none}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .row-check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--text2)}
  .foot{margin-top:14px;font-size:11.5px;color:var(--text2);line-height:1.6}
  @media (max-width:620px){ .grid{grid-template-columns:repeat(2,1fr)} .fields{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
  <section class="hero" aria-live="off">
    <div class="hero__label">今日已赚</div>
    <div class="hero__amount">
      <span class="cur">¥</span><span class="num" id="earned">0</span><span class="dec" id="earnedDec">.00</span>
    </div>
    <div class="hero__mood" id="mood">今天也要好好生活。</div>
    <div class="hero__bar"><i id="bar"></i></div>
    <div class="hero__meta"><span id="range">09:00 — 18:00</span><span id="remain">距下班 --</span></div>
  </section>

  <div class="grid">
    <div class="card"><div class="card__label">每秒进账</div><div class="card__value" id="perSec">0.00<span class="card__unit">元</span></div></div>
    <div class="card"><div class="card__label">时薪</div><div class="card__value" id="perHour">0<span class="card__unit">元</span></div></div>
    <div class="card"><div class="card__label">今日目标</div><div class="card__value" id="daily">0<span class="card__unit">元</span></div></div>
    <div class="card"><div class="card__label">本月预计</div><div class="card__value" id="monthly">0<span class="card__unit">元</span></div></div>
  </div>

  <div class="settings">
    <h2>收入与作息</h2>
    <div class="fields">
      <label class="field">月薪（元）<input id="salary" type="number" min="0" step="100" value="15000"></label>
      <label class="field">每月工作日<input id="workdays" type="number" min="1" max="31" value="21.75"></label>
      <label class="field">午休（分钟）<input id="lunch" type="number" min="0" max="240" step="30" value="60"></label>
      <label class="field">上班时间<input id="start" type="time" value="09:00"></label>
      <label class="field">下班时间<input id="end" type="time" value="18:00"></label>
      <label class="field">心情加成
        <select id="tone">
          <option value="normal">正常</option>
          <option value="fun">幽默</option>
          <option value="calm">安静</option>
        </select>
      </label>
    </div>
    <label class="row-check"><input id="autoSave" type="checkbox" checked> 记住这份设置（仅本机）</label>
    <p class="foot">按「月薪 ÷ 工作日 ÷ 有效工时」折算，午休不计入。数据只在本页面内计算，不会上传。</p>
  </div>

<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  if (params.get('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');

  function sendHeight() {
    try {
      parent.postMessage({ type: 'nc-ws-height', h: Math.max(document.documentElement.scrollHeight, document.body.scrollHeight) }, '*');
    } catch (err) { /* ignore */ }
  }
  try { new ResizeObserver(sendHeight).observe(document.documentElement); } catch (err) { setInterval(sendHeight, 800); }
  window.addEventListener('load', sendHeight);

  var KEY = 'ws-salary-settings';
  var els = {
    earned: document.getElementById('earned'), earnedDec: document.getElementById('earnedDec'),
    mood: document.getElementById('mood'), bar: document.getElementById('bar'),
    range: document.getElementById('range'), remain: document.getElementById('remain'),
    perSec: document.getElementById('perSec'), perHour: document.getElementById('perHour'),
    daily: document.getElementById('daily'), monthly: document.getElementById('monthly'),
    salary: document.getElementById('salary'), workdays: document.getElementById('workdays'),
    lunch: document.getElementById('lunch'), start: document.getElementById('start'),
    end: document.getElementById('end'), tone: document.getElementById('tone'),
    autoSave: document.getElementById('autoSave')
  };

  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function toMinutes(text) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(text || ''));
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  }

  function readSettings() {
    var salary = Math.max(0, Number(els.salary.value) || 0);
    var workdays = Math.max(1, Number(els.workdays.value) || 21.75);
    var lunch = Math.max(0, Number(els.lunch.value) || 0);
    var start = toMinutes(els.start.value);
    var end = toMinutes(els.end.value);
    if (start == null) start = 9 * 60;
    if (end == null) end = 18 * 60;
    if (end <= start) end = start + 60;
    var valid = Math.max(1, end - start - lunch);
    var daily = salary / workdays;
    return {
      salary: salary, workdays: workdays, lunch: lunch, start: start, end: end,
      validSeconds: valid * 60,
      daily: daily,
      perSecond: daily / (valid * 60),
      perHour: daily / (valid / 60)
    };
  }

  function saveSettings() {
    if (!els.autoSave.checked) { try { localStorage.removeItem(KEY); } catch (e) {} return; }
    try {
      localStorage.setItem(KEY, JSON.stringify({
        salary: els.salary.value, workdays: els.workdays.value, lunch: els.lunch.value,
        start: els.start.value, end: els.end.value, tone: els.tone.value
      }));
    } catch (err) { /* ignore */ }
  }

  function loadSettings() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (!data) return;
      if (data.salary != null) els.salary.value = data.salary;
      if (data.workdays != null) els.workdays.value = data.workdays;
      if (data.lunch != null) els.lunch.value = data.lunch;
      if (data.start) els.start.value = data.start;
      if (data.end) els.end.value = data.end;
      if (data.tone && els.tone.querySelector('option[value="' + data.tone + '"]')) els.tone.value = data.tone;
    } catch (err) { /* ignore */ }
  }

  var MOODS = {
    normal: [
      '今天也要好好生活。', '慢慢来，比较快。', '每一分钟都在变成底气。',
      '认真工作，也认真休息。', '把日子过成自己喜欢的样子。'
    ],
    fun: [
      '咖啡钱正在路上 ☕', '今天的奶茶自由已达成 🧋', '距离下班自由又近了一点 🏃',
      '钱包正在悄悄变鼓 💰', '再坚持一下，晚饭在等你 🍜'
    ],
    calm: [
      '专注当下。', '呼吸，继续。', '做好眼前这一件事。', '时间会给出答案。'
    ]
  };

  function moodFor(ratio, tone) {
    var pool = MOODS[tone] || MOODS.normal;
    var index = Math.min(pool.length - 1, Math.floor(ratio * pool.length));
    return pool[index];
  }

  function workProgress(now) {
    var cfg = readSettings();
    var minutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    var worked = Math.max(0, Math.min(cfg.validSeconds / 60, minutes - cfg.start - (minutes > cfg.start + (cfg.end - cfg.start) / 2 ? cfg.lunch : 0)));
    /* 午休简化：超过上班+一半时扣除整段午休 */
    return { cfg: cfg, workedSeconds: Math.max(0, worked) * 60, ratio: Math.max(0, Math.min(1, worked / (cfg.validSeconds / 60))) };
  }

  function render() {
    var now = new Date();
    var info = workProgress(now);
    var cfg = info.cfg;
    var earned = cfg.perSecond * info.workedSeconds;
    var whole = Math.floor(earned);
    var dec = Math.round((earned - whole) * 100);
    if (dec >= 100) { whole += 1; dec -= 100; }
    els.earned.textContent = whole.toLocaleString('zh-CN');
    els.earnedDec.textContent = '.' + (dec < 10 ? '0' + dec : dec);
    els.bar.style.width = (info.ratio * 100).toFixed(1) + '%';
    els.range.textContent = pad2(Math.floor(cfg.start / 60)) + ':' + pad2(cfg.start % 60) + ' — ' +
      pad2(Math.floor(cfg.end / 60)) + ':' + pad2(cfg.end % 60);
    var remainMin = Math.max(0, Math.round((cfg.validSeconds / 60) * (1 - info.ratio)));
    els.remain.textContent = remainMin > 0
      ? '距下班 ' + Math.floor(remainMin / 60) + ' 小时 ' + (remainMin % 60) + ' 分'
      : '今天已下班，辛苦了';
    els.mood.textContent = moodFor(info.ratio, els.tone.value);
    els.perSec.innerHTML = cfg.perSecond.toFixed(4) + '<span class="card__unit">元</span>';
    els.perHour.innerHTML = cfg.perHour.toFixed(1) + '<span class="card__unit">元</span>';
    els.daily.innerHTML = cfg.daily.toFixed(0) + '<span class="card__unit">元</span>';
    els.monthly.innerHTML = cfg.salary.toFixed(0) + '<span class="card__unit">元</span>';
    sendHeight();
  }

  loadSettings();
  ['salary', 'workdays', 'lunch', 'start', 'end', 'tone'].forEach(function (id) {
    els[id].addEventListener('change', function () { saveSettings(); render(); });
  });
  els.autoSave.addEventListener('change', saveSettings);
  render();
  setInterval(render, 1000);
})();
</script>
</body>
</html>
