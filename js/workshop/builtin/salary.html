<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时薪资</title>
<link rel="stylesheet" href="../../../css/tokens.css">
<link rel="stylesheet" href="_shared.css">
<style>
  .hero {
    position: relative;
    overflow: hidden;
    padding: 26px 26px 22px;
    border-radius: 18px;
    color: #fff;
    background:
      radial-gradient(120% 140% at 12% 0%, rgba(255, 255, 255, .28) 0%, transparent 42%),
      linear-gradient(128deg, #4f7df0 0%, #7c5cf5 52%, #c84fe0 100%);
    box-shadow: 0 26px 54px -30px rgba(91, 123, 255, .8);
  }
  .hero__aurora {
    position: absolute; inset: -30%;
    background:
      radial-gradient(closest-side, rgba(255,255,255,.24), transparent 70%) 18% 20% / 46% 52% no-repeat,
      radial-gradient(closest-side, rgba(120,230,255,.22), transparent 70%) 82% 70% / 40% 48% no-repeat;
    animation: aurora 16s var(--ws-ease-in-out) infinite alternate;
    pointer-events: none;
  }
  @keyframes aurora {
    from { transform: translate3d(-3%, -2%, 0) scale(1); }
    to { transform: translate3d(4%, 3%, 0) scale(1.08); }
  }
  html[data-lite="true"] .hero__aurora { animation: none; }

  .hero__label { position: relative; font-size: 12px; font-weight: 600; letter-spacing: .08em; opacity: .85; }
  .hero__amount { position: relative; display: flex; align-items: baseline; gap: 4px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .hero__amount .cur { font-size: 22px; font-weight: 600; opacity: .92; }
  .hero__amount .num { font-size: clamp(40px, 7.4vw, 58px); font-weight: 760; letter-spacing: -.035em; line-height: 1; }
  .hero__amount .dec { font-size: 20px; font-weight: 650; opacity: .9; }
  .hero__mood { position: relative; margin-top: 12px; font-size: 13px; line-height: 1.6; opacity: .95; min-height: 21px; }
  .hero__bar { position: relative; height: 7px; margin-top: 14px; border-radius: 99px; background: rgba(255,255,255,.25); overflow: hidden; }
  .hero__bar i {
    display: block; height: 100%; width: 0%; border-radius: 99px; background: #fff;
    box-shadow: 0 0 12px rgba(255,255,255,.65);
    transition: width 600ms var(--ws-ease-out);
  }
  .hero__bar i::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent);
    transform: translateX(-100%);
    animation: shimmer 2.6s linear infinite;
  }
  @keyframes shimmer { to { transform: translateX(100%); } }
  html[data-lite="true"] .hero__bar i::after { animation: none; display: none; }
  html[data-lite="true"] .hero__bar i { transition: none; }

  .hero__meta { position: relative; display: flex; justify-content: space-between; margin-top: 8px; font-size: 11.5px; opacity: .9; }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
  @media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px; margin-top: 18px; }
  @media (max-width: 640px) { .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--ws-text-2); font-size: 12px; }
  .check input { accent-color: var(--ws-accent); }

  .milestone { animation: pop 900ms var(--ws-ease-out); }
  @keyframes pop { 0% { transform: scale(1); } 28% { transform: scale(1.012); } 100% { transform: scale(1); } }
  html[data-lite="true"] .milestone { animation: none; }
  /* v8：石墨舞台 + 铜色数字；去掉紫色渐变/极光/流光 */
  .hero {
    background: var(--ws-panel);
    color: var(--ws-text);
    border: 1px solid var(--ws-line);
    box-shadow: none;
  }
  .hero__aurora { display: none; }
  .hero__label { color: var(--ws-text-2); opacity: 1; }
  .hero__amount .num { color: var(--nc-time); }
  .hero__amount .cur, .hero__amount .dec { color: var(--nc-time); opacity: 1; }
  .hero__mood { color: var(--ws-text-2); opacity: 1; }
  .hero__bar { background: var(--ws-line); }
  .hero__bar i {
    width: 100%;
    transform: scaleX(0);
    transform-origin: left center;
    background: var(--nc-time);
    box-shadow: none;
    transition: transform 240ms var(--ws-ease-out);
  }
  .hero__bar i::after { display: none; }
  .hero__meta { color: var(--ws-text-3); opacity: 1; }
</style>
<link rel="stylesheet" href="_controls.css">
<script src="_shared.js"></script>
</head>
<body>
  <header class="head rise">
    <div>
      <h1 class="title">实时薪资</h1>
      <p class="sub">按你的作息把今天的时间换算成收入，数字每秒都在涨。</p>
    </div>
    <span class="tag" id="statusTag">工作中</span>
  </header>

  <section class="hero rise rise-2" id="hero">
    <div class="hero__aurora" aria-hidden="true"></div>
    <div class="hero__label">今日已赚</div>
    <div class="hero__amount">
      <span class="cur">¥</span>
      <span class="num" id="earned">0</span>
      <span class="dec" id="earnedDec">.00</span>
    </div>
    <div class="hero__mood" id="mood">今天也要好好生活。</div>
    <div class="hero__bar"><i id="bar"></i></div>
    <div class="hero__meta"><span id="range">08:30 — 17:30</span><span id="remain">距下班 —</span></div>
  </section>

  <div class="stats rise rise-3">
    <div class="stat"><div class="stat__label">每秒进账</div><div class="stat__value" id="perSec">0.00<small>元</small></div></div>
    <div class="stat"><div class="stat__label">时薪</div><div class="stat__value" id="perHour">0<small>元</small></div></div>
    <div class="stat"><div class="stat__label">今日目标</div><div class="stat__value" id="daily">0<small>元</small></div></div>
    <div class="stat"><div class="stat__label">本月预计</div><div class="stat__value" id="monthly">0<small>元</small></div></div>
  </div>

  <div class="section-label">收入与作息</div>
  <div class="fields">
    <label class="field">月薪（元）<input class="input num" id="salary" type="number" min="0" step="100" value="15000"></label>
    <label class="field">每月工作日<input class="input num" id="workdays" type="number" min="1" max="31" step="0.25" value="21.75"></label>
    <label class="field">午休（分钟）<input class="input num" id="lunch" type="number" min="0" max="240" step="30" value="120"></label>
    <label class="field">上班时间<input class="input" id="start" type="time" value="08:30"></label>
    <label class="field">下班时间<input class="input" id="end" type="time" value="17:30"></label>
    <label class="field">倍率
      <select class="select" id="multiplier">
        <option value="1">1× 正常</option>
        <option value="1.5">1.5× 加班</option>
        <option value="2">2× 双倍</option>
        <option value="3">3× 三倍</option>
      </select>
    </label>
  </div>
  <label class="check"><input type="checkbox" id="autoSave" checked> 记住这份设置（仅本机）</label>
  <p class="hint">按「月薪 ÷ 工作日 ÷ 有效工时 × 倍率」折算，午休从总工时中扣除；数字为本机计算结果，不会上传。</p>

<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  if (params.get('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
  if (params.get('lite') === '1') document.documentElement.setAttribute('data-lite', 'true');
  function sendHeight() {
    try { parent.postMessage({ type: 'nc-ws-height', h: Math.max(document.documentElement.scrollHeight, document.body.scrollHeight) }, '*'); } catch (err) {}
  }
  try { new ResizeObserver(sendHeight).observe(document.documentElement); } catch (err) { setInterval(sendHeight, 800); }

  var KEY = 'ws-salary-v2';
  var els = {
    hero: document.getElementById('hero'), earned: document.getElementById('earned'),
    dec: document.getElementById('earnedDec'), mood: document.getElementById('mood'),
    bar: document.getElementById('bar'), range: document.getElementById('range'),
    remain: document.getElementById('remain'), perSec: document.getElementById('perSec'),
    perHour: document.getElementById('perHour'), daily: document.getElementById('daily'),
    monthly: document.getElementById('monthly'), statusTag: document.getElementById('statusTag'),
    salary: document.getElementById('salary'), workdays: document.getElementById('workdays'),
    lunch: document.getElementById('lunch'), start: document.getElementById('start'),
    end: document.getElementById('end'), multiplier: document.getElementById('multiplier'),
    autoSave: document.getElementById('autoSave')
  };

  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function toMinutes(text) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(text || ''));
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  }

  function readConfig() {
    var salary = Math.max(0, Number(els.salary.value) || 0);
    var workdays = Math.max(1, Number(els.workdays.value) || 21.75);
    var lunch = Math.max(0, Number(els.lunch.value) || 0);
    var start = toMinutes(els.start.value);
    var end = toMinutes(els.end.value);
    if (start == null) start = 8 * 60 + 30;
    if (end == null) end = 17 * 60 + 30;
    if (end <= start) end = start + 60;
    var span = end - start;
    lunch = Math.min(lunch, Math.max(0, span - 1));
    var valid = Math.max(1, span - lunch);
    var multiplier = Math.max(0.1, Number(els.multiplier.value) || 1);
    var daily = salary / workdays;
    var hourly = daily / (valid / 60);
    return {
      salary: salary, workdays: workdays, lunch: lunch, start: start, end: end,
      span: span, valid: valid, multiplier: multiplier,
      daily: daily, hourly: hourly,
      perSecond: (daily / (valid * 60)) * multiplier,
      dailyWithMultiplier: daily * multiplier
    };
  }

  function workedMinutes(nowMinutes, cfg) {
    /* 午休从中间时段扣除：上班 + 有效工时/2 后连续午休 */
    var lunchStart = cfg.start + (cfg.span - cfg.lunch) / 2;
    var lunchEnd = lunchStart + cfg.lunch;
    var end = Math.min(nowMinutes, cfg.end);
    if (end <= cfg.start) return 0;
    var worked = end - cfg.start;
    var overlap = Math.max(0, Math.min(end, lunchEnd) - Math.max(cfg.start, lunchStart));
    return Math.max(0, worked - overlap);
  }

  var MOODS = [
    '今天也要好好生活。', '每一分钟都在变成底气。', '咖啡钱正在路上。',
    '慢一点也没关系，你在往前走。', '把时间换成喜欢的生活。'
  ];

  var shown = 0;
  var lastMilestone = 0;

  function render() {
    var now = new Date();
    var nowMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    var cfg = readConfig();
    var worked = workedMinutes(nowMinutes, cfg);
    var earned = Math.min(cfg.dailyWithMultiplier, cfg.perSecond * worked * 60);
    var ratio = cfg.dailyWithMultiplier ? Math.min(1, earned / cfg.dailyWithMultiplier) : 0;

    /* 平滑逼近，避免每秒跳一下 */
    shown += (earned - shown) * 0.24;
    if (Math.abs(earned - shown) < 0.005) shown = earned;
    var whole = Math.floor(shown);
    var dec = Math.round((shown - whole) * 100);
    if (dec >= 100) { whole += 1; dec -= 100; }
    els.earned.textContent = whole.toLocaleString('zh-CN');
    els.dec.textContent = '.' + (dec < 10 ? '0' + dec : dec);

    els.bar.style.transform = 'scaleX(' + ratio.toFixed(4) + ')';
    els.range.textContent = pad2(Math.floor(cfg.start / 60)) + ':' + pad2(cfg.start % 60) + ' — ' +
      pad2(Math.floor(cfg.end / 60)) + ':' + pad2(cfg.end % 60);

    var remainMin = Math.max(0, Math.round(cfg.valid * (1 - ratio)));
    els.remain.textContent = ratio >= 1 ? '今天已下班，辛苦了' : '距下班 ' + Math.floor(remainMin / 60) + ' 小时 ' + (remainMin % 60) + ' 分';

    var moodIndex = Math.min(MOODS.length - 1, Math.floor(ratio * MOODS.length));
    if (ratio >= 1) els.mood.textContent = '今天的时间已经全部换成收入，去享受下班吧。';
    else if (ratio < 0.08) els.mood.textContent = '刚到工位，先泡杯茶。';
    else els.mood.textContent = MOODS[moodIndex];

    els.perSec.innerHTML = cfg.perSecond.toFixed(4) + '<small>元</small>';
    els.perHour.innerHTML = cfg.hourly.toFixed(1) + '<small>元</small>';
    els.daily.innerHTML = cfg.dailyWithMultiplier.toFixed(0) + '<small>元</small>';
    els.monthly.innerHTML = cfg.salary.toFixed(0) + '<small>元</small>';
    els.statusTag.textContent = ratio >= 1 ? '已下班' : (nowMinutes < cfg.start ? '未上班' : '工作中');
    els.statusTag.className = 'tag' + (ratio >= 1 ? ' tag--ok' : '');

    /* 里程碑：每 25% 轻微一次强调 */
    var milestone = Math.floor(ratio * 4);
    if (milestone > lastMilestone && milestone < 4) {
      lastMilestone = milestone;
      els.hero.classList.remove('milestone');
      void els.hero.offsetWidth;
      els.hero.classList.add('milestone');
    }
  }

  function save() {
    if (!els.autoSave.checked) { try { localStorage.removeItem(KEY); } catch (e) {} return; }
    try {
      localStorage.setItem(KEY, JSON.stringify({
        salary: els.salary.value, workdays: els.workdays.value, lunch: els.lunch.value,
        start: els.start.value, end: els.end.value, multiplier: els.multiplier.value
      }));
    } catch (err) {}
  }

  function load() {
    try {
      var data = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!data) return;
      if (data.salary != null) els.salary.value = data.salary;
      if (data.workdays != null) els.workdays.value = data.workdays;
      if (data.lunch != null) els.lunch.value = data.lunch;
      if (data.start) els.start.value = data.start;
      if (data.end) els.end.value = data.end;
      if (data.multiplier && els.multiplier.querySelector('option[value="' + data.multiplier + '"]')) els.multiplier.value = data.multiplier;
    } catch (err) {}
  }

  ['salary', 'workdays', 'lunch', 'start', 'end', 'multiplier'].forEach(function (id) {
    els[id].addEventListener('change', function () { save(); shown = 0; lastMilestone = 0; render(); });
  });
  els.autoSave.addEventListener('change', save);

  load();
  // v8：4fps 足够读数字，避免每帧 4 次 innerHTML + 布局
  render();
  var tickTimer = setInterval(render, 250);
  window.addEventListener('pagehide', function () { clearInterval(tickTimer); });
})();
</script>
</body>
</html>
