<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>番茄钟</title>
<link rel="stylesheet" href="../../../css/tokens.css">
<link rel="stylesheet" href="_shared.css">
<style>
  .stage {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 22px 16px 20px; border: 1px solid var(--ws-line); border-radius: 18px;
    background: radial-gradient(120% 90% at 50% 0%, var(--ws-accent-soft), transparent 66%), var(--ws-panel);
    overflow: hidden;
  }
  .ring { position: relative; width: 208px; height: 208px; }
  .ring svg { transform: rotate(-90deg); display: block; }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .track { stroke: var(--ws-line); }
  .ring .bar { stroke: var(--ws-accent); stroke-linecap: round; transition: stroke-dashoffset 300ms linear, stroke var(--ws-dur) var(--ws-ease-out); }
  .ring.is-break .bar { stroke: var(--ws-ok); }
  .ring .inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .clock { font-size: 42px; font-weight: 720; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .phase { color: var(--ws-text-2); font-size: 11.5px; letter-spacing: .05em; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .rounds { display: flex; gap: 14px; color: var(--ws-text-2); font-size: 11.5px; }
  .rounds b { color: var(--ws-text); font-size: 14px; margin-left: 3px; font-variant-numeric: tabular-nums; }
  .setup { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .setup .field input { text-align: center; font-variant-numeric: tabular-nums; }
  .switch { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--ws-text-2); font-size: 12px; }
  .switch input { accent-color: var(--ws-accent); }
  html[data-lite="true"] .ring .bar { transition: none; }
</style>
<link rel="stylesheet" href="_controls.css">
<script src="_shared.js"></script>
</head>
<body>
  <header class="head rise">
    <div>
      <h1 class="title">番茄钟</h1>
      <p class="sub">专注 25 分钟，休息 5 分钟；到点提示，循环进行。</p>
    </div>
    <div class="seg" role="group" aria-label="模式">
      <button type="button" data-mode="focus" aria-pressed="true">专注</button>
      <button type="button" data-mode="break" aria-pressed="false">休息</button>
    </div>
  </header>

  <section class="stage rise rise-2">
    <div class="ring" id="ring">
      <svg width="208" height="208" viewBox="0 0 208 208">
        <circle class="track" cx="104" cy="104" r="92"></circle>
        <circle class="bar" id="bar" cx="104" cy="104" r="92" stroke-dasharray="578.1" stroke-dashoffset="0"></circle>
      </svg>
      <div class="inner">
        <div class="clock num" id="clock">25:00</div>
        <div class="phase" id="phase">准备开始</div>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn btn--primary" id="start">开始</button>
      <button type="button" class="btn btn--ghost" id="reset">重置</button>
      <button type="button" class="btn btn--ghost" id="skip">跳过本轮</button>
    </div>
    <div class="rounds">
      <span>完成番茄<b id="done">0</b></span>
      <span>专注累计<b id="total">0</b> 分钟</span>
    </div>
  </section>

  <div class="setup rise rise-3">
    <label class="field">专注时长（分钟）<input class="input num" id="focusMin" type="number" min="1" max="180" value="25"></label>
    <label class="field">休息时长（分钟）<input class="input num" id="breakMin" type="number" min="1" max="60" value="5"></label>
  </div>
  <div style="display:flex;gap:16px;flex-wrap:wrap">
    <label class="switch"><input type="checkbox" id="sound" checked> 结束提示音</label>
    <label class="switch"><input type="checkbox" id="auto"> 自动进入下一轮</label>
  </div>
  <p class="hint">空格：开始 / 暂停 · R：重置。计时仅在页面打开期间有效。</p>

<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  if (params.get('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
  if (params.get('lite') === '1') document.documentElement.setAttribute('data-lite', 'true');
  function sendHeight() {
    try { parent.postMessage({ type: 'nc-ws-height', h: Math.max(document.documentElement.scrollHeight, document.body.scrollHeight) }, '*'); } catch (err) {}
  }
  try { new ResizeObserver(sendHeight).observe(document.documentElement); } catch (err) { setInterval(sendHeight, 800); }

  var els = {
    ring: document.getElementById('ring'), clock: document.getElementById('clock'),
    phase: document.getElementById('phase'), bar: document.getElementById('bar'),
    start: document.getElementById('start'), reset: document.getElementById('reset'),
    skip: document.getElementById('skip'), done: document.getElementById('done'),
    total: document.getElementById('total'), focusMin: document.getElementById('focusMin'),
    breakMin: document.getElementById('breakMin'), sound: document.getElementById('sound'),
    auto: document.getElementById('auto')
  };
  var CIRC = 2 * Math.PI * 92;
  var state = { mode: 'focus', running: false, remain: 1500, total: 1500, done: 0, focused: 0, tick: null, endAt: 0 };

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function minutes(mode) {
    var value = Number(mode === 'focus' ? els.focusMin.value : els.breakMin.value);
    if (!isFinite(value) || value < 1) value = mode === 'focus' ? 25 : 5;
    return Math.min(180, Math.max(1, Math.round(value)));
  }

  function beep() {
    if (!els.sound.checked) return;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      [0, 0.24].forEach(function (offset, index) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = index ? 1046 : 880;
        var start = ctx.currentTime + offset;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.22, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.5);
        osc.connect(gain).connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.55);
      });
    } catch (err) {}
  }

  function render() {
    var remain = Math.max(0, Math.ceil(state.remain));
    els.clock.textContent = pad(Math.floor(remain / 60)) + ':' + pad(remain % 60);
    els.phase.textContent = state.running ? (state.mode === 'focus' ? '专注中' : '休息中') : (state.mode === 'focus' ? '准备开始' : '休息一下');
    els.start.textContent = state.running ? '暂停' : '开始';
    var ratio = state.total ? state.remain / state.total : 0;
    els.bar.style.strokeDashoffset = String(CIRC * (1 - ratio));
    els.bar.style.strokeDasharray = String(CIRC);
    els.ring.classList.toggle('is-break', state.mode === 'break');
    els.done.textContent = String(state.done);
    els.total.textContent = String(Math.round(state.focused / 60));
    sendHeight();
  }

  function resetRound() {
    state.total = minutes(state.mode) * 60;
    state.remain = state.total;
    render();
  }

  function start() {
    if (state.running) { pause(); return; }
    if (state.remain <= 0) resetRound();
    state.endAt = Date.now() + state.remain * 1000;
    state.running = true;
    state.tick = setInterval(function () {
      state.remain = (state.endAt - Date.now()) / 1000;
      if (state.mode === 'focus') state.focused += 0.25;
      if (state.remain <= 0) { finish(); return; }
      render();
    }, 250);
    render();
  }

  function pause() {
    state.running = false;
    clearInterval(state.tick);
    state.tick = null;
    render();
  }

  function finish() {
    beep();
    pause();
    if (state.mode === 'focus') state.done += 1;
    state.mode = state.mode === 'focus' ? 'break' : 'focus';
    document.querySelectorAll('.seg > button').forEach(function (btn) {
      btn.setAttribute('aria-pressed', btn.getAttribute('data-mode') === state.mode ? 'true' : 'false');
    });
    resetRound();
    if (els.auto.checked) setTimeout(start, 700);
  }

  els.start.addEventListener('click', start);
  els.reset.addEventListener('click', function () { pause(); resetRound(); });
  els.skip.addEventListener('click', finish);
  [els.focusMin, els.breakMin].forEach(function (input) {
    input.addEventListener('change', function () { if (!state.running) resetRound(); });
  });
  document.querySelectorAll('.seg > button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      pause();
      document.querySelectorAll('.seg > button').forEach(function (item) {
        item.setAttribute('aria-pressed', item === btn ? 'true' : 'false');
      });
      state.mode = btn.getAttribute('data-mode');
      resetRound();
    });
  });
  document.addEventListener('keydown', function (event) {
    if (event.target && /input|textarea/i.test(event.target.tagName)) return;
    if (event.key === ' ') { event.preventDefault(); start(); }
    else if (event.key === 'r' || event.key === 'R') { pause(); resetRound(); }
  });

  resetRound();
})();
</script>
</body>
</html>
