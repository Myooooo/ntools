<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>番茄钟 / 计时器</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#131922; --text:#edf1f7; --text2:#9aa7b8; --line:rgba(255,255,255,.1);
    --accent:#6ea8fe; --danger:#ff7a72; --ok:#45d6a0; --soft:rgba(110,168,254,.14);
  }
  html[data-theme="light"]{
    --bg:#f4f5f7; --panel:#ffffff; --text:#15181d; --text2:#56616f; --line:rgba(0,0,0,.1);
    --accent:#2a63c8; --danger:#c53b3b; --ok:#0e9a6a; --soft:rgba(47,111,219,.1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  body{padding:20px 22px 26px;max-width:720px;margin:0 auto}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .title{font-size:16px;font-weight:650;letter-spacing:-.01em}
  .modes{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .modes button{border:0;background:transparent;color:var(--text2);padding:5px 11px;font-size:12.5px;cursor:pointer}
  .modes button.on{background:var(--soft);color:var(--text)}
  .stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0 6px}
  .ring{position:relative;width:220px;height:220px}
  .ring svg{transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:8}
  .ring .track{stroke:var(--line)}
  .ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .35s linear}
  .ring .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .clock{font-size:44px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .phase{font-size:12px;color:var(--text2);letter-spacing:.08em}
  .actions{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;justify-content:center}
  button.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;
    padding:8px 16px;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s}
  button.btn:hover{border-color:var(--accent)}
  button.btn.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
  button.btn.ghost{background:transparent}
  .settings{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  .field{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text2)}
  .field input{width:74px;background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:5px 8px;font-size:12.5px;text-align:right}
  .stat{display:flex;justify-content:center;gap:22px;margin-top:16px;font-size:12.5px;color:var(--text2)}
  .stat b{color:var(--text);font-size:15px;margin-left:4px}
  .hint{margin-top:14px;font-size:11.5px;color:var(--text2);text-align:center;line-height:1.6}
  @media (prefers-reduced-motion: reduce){ .ring .bar{transition:none} }
</style>
</head>
<body>
  <div class="head">
    <div class="title">番茄钟 / 计时器</div>
    <div class="modes" role="group" aria-label="模式">
      <button type="button" data-mode="focus" class="on">专注</button>
      <button type="button" data-mode="break">休息</button>
    </div>
  </div>

  <div class="stage">
    <div class="ring">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle class="track" cx="110" cy="110" r="100"></circle>
        <circle class="bar" cx="110" cy="110" r="100" stroke-dasharray="628.3" stroke-dashoffset="0"></circle>
      </svg>
      <div class="time">
        <div class="clock" id="clock">25:00</div>
        <div class="phase" id="phase">准备开始</div>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn primary" id="start">开始</button>
      <button type="button" class="btn ghost" id="reset">重置</button>
      <button type="button" class="btn ghost" id="skip">跳过本轮</button>
    </div>
    <div class="stat">
      <span>本轮完成 <b id="done">0</b></span>
      <span>专注时长 <b id="total">0</b> 分钟</span>
    </div>
  </div>

  <div class="settings">
    <label class="field">专注（分钟）<input id="focusMin" type="number" min="1" max="180" value="25"></label>
    <label class="field">休息（分钟）<input id="breakMin" type="number" min="1" max="60" value="5"></label>
    <label class="field">提示音
      <input id="sound" type="checkbox" checked style="width:auto">
    </label>
    <label class="field">自动进入下一轮
      <input id="auto" type="checkbox" style="width:auto">
    </label>
  </div>
  <p class="hint">空格：开始 / 暂停 · R：重置。计时在页面打开期间有效，关闭即结束。</p>

<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  if (params.get('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');

  function sendHeight() {
    try {
      parent.postMessage({ type: 'nc-ws-height', h: Math.max(document.documentElement.scrollHeight, document.body.scrollHeight) }, '*');
    } catch (err) { /* ignore */ }
  }
  try { new ResizeObserver(sendHeight).observe(document.documentElement); } catch (err) { setInterval(sendHeight, 600); }
  window.addEventListener('load', sendHeight);
  setTimeout(sendHeight, 80);

  var els = {
    clock: document.getElementById('clock'),
    phase: document.getElementById('phase'),
    start: document.getElementById('start'),
    reset: document.getElementById('reset'),
    skip: document.getElementById('skip'),
    done: document.getElementById('done'),
    total: document.getElementById('total'),
    focusMin: document.getElementById('focusMin'),
    breakMin: document.getElementById('breakMin'),
    sound: document.getElementById('sound'),
    auto: document.getElementById('auto'),
    bar: document.querySelector('.ring .bar')
  };
  var CIRC = 2 * Math.PI * 100;
  var state = { mode: 'focus', running: false, remain: 25 * 60, total: 25 * 60, done: 0, focused: 0, tick: null };

  function beep() {
    if (!els.sound.checked) return;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.9);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.95);
    } catch (err) { /* ignore */ }
  }

  function minutes(mode) {
    var value = mode === 'focus' ? Number(els.focusMin.value) : Number(els.breakMin.value);
    if (!isFinite(value) || value < 1) value = mode === 'focus' ? 25 : 5;
    return Math.min(180, Math.max(1, Math.round(value)));
  }

  function render() {
    var m = Math.floor(state.remain / 60);
    var s = state.remain % 60;
    els.clock.textContent = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
    els.phase.textContent = state.running
      ? (state.mode === 'focus' ? '专注中' : '休息中')
      : (state.mode === 'focus' ? '准备开始' : '休息一下');
    els.start.textContent = state.running ? '暂停' : '开始';
    var ratio = state.total ? state.remain / state.total : 0;
    els.bar.style.strokeDasharray = String(CIRC);
    els.bar.style.strokeDashoffset = String(CIRC * (1 - ratio));
    els.bar.style.stroke = state.mode === 'focus' ? 'var(--accent)' : 'var(--ok)';
    els.done.textContent = String(state.done);
    els.total.textContent = String(Math.round(state.focused / 60));
    sendHeight();
  }

  function stateReset() {
    state.remain = state.total = minutes(state.mode) * 60;
    render();
  }
  function stateStart() {
    if (state.running) { pause(); return; }
    state.running = true;
    state.tick = setInterval(function () {
      state.remain -= 1;
      if (state.mode === 'focus') state.focused += 1;
      if (state.remain <= 0) finishRound();
      render();
    }, 1000);
    render();
  }
  function pause() {
    state.running = false;
    clearInterval(state.tick);
    state.tick = null;
    render();
  }
  function finishRound() {
    beep();
    clearInterval(state.tick);
    state.tick = null;
    state.running = false;
    if (state.mode === 'focus') state.done += 1;
    var nextMode = state.mode === 'focus' ? 'break' : 'focus';
    state.mode = nextMode;
    state.remain = state.total = minutes(nextMode) * 60;
    document.querySelectorAll('.modes button').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-mode') === nextMode);
    });
    if (els.auto.checked) setTimeout(stateStart, 600);
    render();
  }

  els.start.addEventListener('click', stateStart);
  els.reset.addEventListener('click', function () { pause(); stateReset(); });
  els.skip.addEventListener('click', function () { finishRound(); });
  [els.focusMin, els.breakMin].forEach(function (input) {
    input.addEventListener('change', function () {
      if (!state.running) stateReset();
    });
  });
  document.querySelectorAll('.modes button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      pause();
      document.querySelectorAll('.modes button').forEach(function (b) { b.classList.remove('on'); });
      btn.classList.add('on');
      state.mode = btn.getAttribute('data-mode');
      stateReset();
    });
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === ' ') { event.preventDefault(); stateStart(); }
    else if (event.key === 'r' || event.key === 'R') { pause(); stateReset(); }
  });

  stateReset();
})();
</script>
</body>
</html>
